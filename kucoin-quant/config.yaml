# kucoin-quant configuration. Live trading is DISABLED unless KQ_LIVE=1 is exported AND live.enabled is true.
account:
  capital_usd: 500
  quote: USDT
live:
  enabled: false            # hard gate; also requires env KQ_LIVE=1 and KQ_AUTHORIZED="I AUTHORIZE LIVE TRADING"
risk:
  max_position_usd: 125     # 25% of capital per position
  max_concurrent: 2
  risk_per_trade_usd: 12.5  # 2.5% of capital, implied by 10% stop on $125
  daily_loss_limit_usd: 25  # 5%; scanner refuses new entries after this
  max_drawdown_usd: 75      # 15%; system halts and requires manual re-enable
  cash_reserve_usd: 250     # never deployed by the primary strategy
strategy:                   # "liquid capitulation reversion" (see PROPOSAL.md section E)
  name: capitulation_reversion
  timeframe: 1hour
  lookback_hours: 48        # close must be below the low of the prior 48 candles
  min_24h_drop: 0.05        # and at least 5% below the close 24h earlier
  min_24h_turnover_usd: 3000000   # point-in-time trailing 24h turnover (KuCoin only)
  max_spread_bps: 15
  hold_hours: 24
  stop_loss: 0.10
  excluded_prefixes: ["USDC", "USDT", "DAI", "TUSD", "FDUSD", "USDE", "PYUSD", "USDG", "USD1", "EUR", "XAUT", "PAXG"]
  exclude_st_flag: true     # KuCoin "st" (special treatment / delisting-risk) symbols
  exclude_listed_within_days: 14
intel:                      # external sources are logged for FORWARD evaluation only; they do not gate trades yet
  dexscreener: true
  geckoterminal: true
  coingecko_trending: true
  polymarket: true
  kucoin_announcements: true
paths:
  signals_log: data/signals.jsonl
  paper_log: data/paper_trades.jsonl
  intel_log: data/intel_snapshots.jsonl
  state: data/state.json
